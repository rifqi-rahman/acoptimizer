# Konfigurasi Broker MQTT Mosquitto Lokal (Booth / Kampus FST UIN Jakarta)
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Listener 1: TCP 1883 untuk Mikrokontroler ESP32 (R.601) & Backend Bridge
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# Listener 2: WebSocket 9001 untuk Koneksi Langsung Browser Web App Digital Twin
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

